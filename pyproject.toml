[project]
name = "llm-token-costs"
version = "0.1.0"
description = "LLM plugin: what your logged prompts cost, priced with llm-prices"
readme = "README.md"
authors = [{ name = "Matthew Busel" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
keywords = ["llm", "llm-plugin", "cost", "pricing", "tokens", "openai", "anthropic", "gemini"]
dependencies = [
    "llm>=0.27",
    "llm-prices>=1.3",
    "sqlite-utils",
    "click",
]

[project.urls]
Homepage = "https://github.com/Mattbusel/llm-token-costs"
Changelog = "https://github.com/Mattbusel/llm-token-costs/blob/main/CHANGELOG.md"
Issues = "https://github.com/Mattbusel/llm-token-costs/issues"
CI = "https://github.com/Mattbusel/llm-token-costs/actions"

[project.entry-points.llm]
token_costs = "llm_token_costs"

[project.optional-dependencies]
test = ["pytest"]
tiktoken = ["tiktoken"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["llm_token_costs"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
